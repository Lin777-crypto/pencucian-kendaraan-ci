name: CI Pipeline - Sistem Pencucian Kendaraan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Automated Unit Testing
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Run Build & Syntax Check
        run: npm run build

      - name: 5. Run Automated Tests
        run: npm test
